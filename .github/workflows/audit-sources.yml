name: Audit upstream sources

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/audit-sources.yml'
      - 'README.md'
      - 'resolver.py'
      - 'readme.py'
      - 'blacklist.py'
      - 'filter.py'
      - 'rules/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-upstream-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tld IPy loguru httpx dnspython pytest
      - name: Run regression tests
        run: |
          python -m py_compile resolver.py blacklist.py scripts/audit_sources.py scripts/generate_domain_input.py scripts/validated_sources.py scripts/verify_critical_domains.py
          python -m pytest -q tests
      - name: Audit source lists with current resolver
        run: python scripts/audit_sources.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: upstream-source-audit
          path: .cache/audit/
          if-no-files-found: warn
          retention-days: 14
