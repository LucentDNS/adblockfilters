name: Generate DNS State

# Auxiliary DNS diagnostics run weekly or on manual request. They never gate production builds.
permissions:
  contents: write
  actions: write

concurrency:
  # Latest-run-wins for DNS validation; production builds use a separate concurrency group.
  group: dns-validation-state-${{ github.repository }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Daily at 16:43 Beijing time (08:43 UTC); stagger away from common scheduler peak times.
    - cron: '43 8 * * 0' # Weekly auxiliary DNS diagnostics; never gates production builds.

env:
  TZ: Asia/Shanghai
  SMARTDNS_URL: https://github.com/pymumu/smartdns/releases/download/Release48.4/smartdns.1.2026.08.05-0921.x86_64-debian-all.deb
  SMARTDNS_SHA256: 4cc1b8f9db10110e1212d981cfee7eb89a3c80f5766760e3b5f7541c8da8b546
  SMARTDNS_PATH: /tmp/smartdns

jobs:
  Generate_Domain_State:
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          set -euo pipefail
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Static analysis
        run: |
          set -euo pipefail
          python -m ruff check --no-cache .
          python -m ruff check --no-cache --select F401 scripts tests

      - name: Run DNS resolver regression tests
        run: |
          set -euo pipefail
          python -m py_compile blacklist.py
          python -m pytest -q tests

      - name: Setup SmartDNS
        run: |
          set -euo pipefail
          mkdir -p "$SMARTDNS_PATH"
          wget --https-only --timeout=30 --tries=3 --waitretry=2 "$SMARTDNS_URL" -O "$SMARTDNS_PATH/smartdns.deb"
          echo "$SMARTDNS_SHA256  $SMARTDNS_PATH/smartdns.deb" | sha256sum --check -
          dpkg-deb --extract "$SMARTDNS_PATH/smartdns.deb" "$SMARTDNS_PATH/root"
          SMARTDNS_BIN="$(find "$SMARTDNS_PATH/root" -type f -name smartdns -print -quit)"
          test -n "$SMARTDNS_BIN" || { echo "Verified SmartDNS Debian package contains no smartdns executable"; exit 1; }
          chmod +x "$SMARTDNS_BIN"
          file "$SMARTDNS_BIN"
          readelf -l "$SMARTDNS_BIN" | grep -F "Requesting program interpreter" || true
          ldd "$SMARTDNS_BIN" || true
          rm -f "$SMARTDNS_PATH/smartdns.deb"
          cp smartdns.conf "$SMARTDNS_PATH/smartdns.conf"
          # This release uses a relative ELF interpreter path (lib/ld-musl-*.so.1).
          # Launch from its own directory so the bundled musl runtime is found.
          SMARTDNS_ROOT="$(dirname "$SMARTDNS_BIN")"
          cd "$SMARTDNS_ROOT"
          SMARTDNS_LOG="$SMARTDNS_PATH/smartdns.log"
          nohup ./smartdns -f -x -c "$SMARTDNS_PATH/smartdns.conf" > "$SMARTDNS_LOG" 2>&1 &
          SMARTDNS_PID=$!
          ready=0
          for i in $(seq 1 30); do
            if ! kill -0 "$SMARTDNS_PID" 2>/dev/null; then
              echo "::error::SmartDNS exited during startup"
              cat "$SMARTDNS_LOG"
              exit 1
            fi
            listeners_ready=1
            for port in 5053 5054 5055 5056 5057 5058; do
              if ! ss -H -lun | grep -Eq "127\\.0\\.0\\.1:$port([[:space:]]|$)"; then
                listeners_ready=0
                break
              fi
            done
            if [ "$listeners_ready" = "1" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" = "0" ]; then
            echo "::error::SmartDNS did not bind all six local DNS listeners within 30s"
            cat "$SMARTDNS_LOG"
            exit 1
          fi

      - name: Verify all six SmartDNS upstreams independently
        run: |
          set -euo pipefail
          python - <<'PY'
          import dns.resolver
          from dns.resolver import NXDOMAIN

          upstreams = {
              5053: ("baidu.com", "qq.com", "example.com"),
              5054: ("baidu.com", "qq.com", "example.com"),
              5055: ("baidu.com", "qq.com", "example.com"),
              5056: ("example.com", "cloudflare.com", "google.com"),
              5057: ("example.com", "cloudflare.com", "google.com"),
              5058: ("example.com", "cloudflare.com", "google.com"),
          }
          probe = "adblock-dns-probe-20261125.example.invalid"
          failures = []

          for port, domains in upstreams.items():
              resolver = dns.resolver.Resolver(configure=False)
              resolver.nameservers = ["127.0.0.1"]
              resolver.port = port
              resolver.timeout = 3.0
              resolver.lifetime = 8.0

              success = []
              for domain in domains:
                  try:
                      answer = resolver.resolve(domain, "A")
                      if len(answer) > 0:
                          success.append(domain)
                  except Exception as exc:
                      print(f"Upstream {port} probe failed for {domain}: {type(exc).__name__}: {exc}")

              if len(success) < 2:
                  failures.append(f"upstream {port}: fewer than two positive probes resolved ({success})")

              for rdtype in ("A", "AAAA"):
                  try:
                      resolver.resolve(probe, rdtype)
                  except NXDOMAIN:
                      print(f"Upstream {port}: {rdtype} NXDOMAIN probe passed")
                  except Exception as exc:
                      failures.append(f"upstream {port}: {rdtype} reserved-name probe failed: {type(exc).__name__}: {exc}")
                  else:
                      failures.append(f"upstream {port}: {rdtype} did not return NXDOMAIN for reserved .invalid name")

              print(f"Upstream {port} positive probes passed: {', '.join(success)}")

          if failures:
              raise SystemExit("DNS validation upstream health check failed:\\n- " + "\\n- ".join(failures))
          PY

      - name: Verify all six upstreams under production query load
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import dns.asyncresolver
          from dns.resolver import NoAnswer

          ports = (5053, 5054, 5055, 5056, 5057, 5058)
          domains = (
              "example.com", "cloudflare.com", "google.com", "github.com",
              "microsoft.com", "apple.com", "wikipedia.org", "baidu.com",
              "qq.com", "amazon.com", "mozilla.org", "iana.org",
          )

          async def check(port, domain):
              resolver = dns.asyncresolver.Resolver(configure=False)
              resolver.nameservers = ["127.0.0.1"]
              resolver.port = port
              resolver.timeout = 2.5
              resolver.lifetime = 6.0
              results = await asyncio.gather(
                  resolver.resolve(domain, "A"),
                  resolver.resolve(domain, "AAAA"),
                  return_exceptions=True,
              )
              a_ok = not isinstance(results[0], Exception) and len(results[0]) > 0
              aaaa_ok = not isinstance(results[1], Exception) or isinstance(results[1], NoAnswer)
              return a_ok and aaaa_ok, domain, results

          async def main():
              failures = []
              for port in ports:
                  # Match the production per-upstream cap: 12 domains x A/AAAA.
                  results = await asyncio.gather(*(check(port, domain) for domain in domains))
                  passed = sum(1 for ok, _, _ in results if ok)
                  print(f"Upstream {port}: production-load probe {passed}/{len(domains)}")
                  if passed < 11:
                      for ok, domain, answers in results:
                          if not ok:
                              failures.append(f"port={port} domain={domain}: {answers}")
              if failures:
                  raise SystemExit("Production-load DNS preflight failed:\\n" + "\\n".join(failures))

          asyncio.run(main())
          PY

      - name: Download database
        run: |
          set -euo pipefail
          # The first AdBlock DNS run must not inherit upstream block/IP state.
          # Reuse a database only after our own fresh-validation marker exists.
          if curl -fsSL --retry 3 --retry-all-errors \
              "https://github.com/${{ github.repository }}/releases/download/dns-validation-state/dns-validation-bootstrap-complete-v2.txt" \
              -o /tmp/dns-validation-bootstrap-complete-v2.txt; then
            curl -fsSL --retry 3 --retry-all-errors -o domain.db \
              "https://github.com/${{ github.repository }}/releases/download/dns-validation-state/domain.db"
            test -s domain.db || { echo "DNS validation database is missing or empty"; exit 1; }
            echo "Using the previously generated DNS-validation database."
          else
            echo "No DNS validation marker found; starting with an empty database for a full independent DNS pass."
            : > domain.db
          fi

      - name: Generate DNS validation input from configured DNS sources
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_domain_input.py
          python scripts/generate_domain_input.py
          test -s .cache/domain/domain.txt || { echo "DNS domain input is missing or empty"; exit 1; }
          cp .cache/domain/domain.txt domain.txt
          cp .cache/domain/domain-input-provenance.json domain-input-provenance.json
          python -m py_compile scripts/validated_sources.py
          python scripts/validated_sources.py package
          cp .cache/domain/validated-dns-sources.tar.gz validated-dns-sources.tar.gz
          test -s validated-dns-sources.tar.gz || { echo "Validated DNS source archive was not packaged"; exit 1; }

      - name: Fingerprint DNS validation inputs
        id: checkpoint_fingerprint
        run: |
          set -euo pipefail
          fingerprint="$(sha256sum .github/workflows/blacklist.yml domain.txt sources.json blacklist.py resolver.py smartdns.conf requirements.txt readme.py updater.py scripts/generate_domain_input.py scripts/validated_sources.py rules/myblock.txt | sha256sum | cut -d' ' -f1)"
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "DNS validation checkpoint fingerprint: $fingerprint"

      - name: Restore latest compatible DNS validation checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: domain.db
          key: dns-validation-checkpoint-${{ steps.checkpoint_fingerprint.outputs.value }}-${{ github.run_id }}
          restore-keys: |
            dns-validation-checkpoint-${{ steps.checkpoint_fingerprint.outputs.value }}-

      - name: Run DNS validation and generate independent blacklist
        id: generate
        timeout-minutes: 160
        run: |
          set -euo pipefail
          python -m py_compile blacklist.py
          python blacklist.py 2>&1 | tee blacklist.log
          test -s domain.db || { echo "domain.db missing after blacklist generation"; exit 1; }
          # Empty lists are represented by a comment-only file so GitHub can
          # publish a non-empty asset while the parser still treats it as empty.
          test -s black.txt || printf '! Validated blacklist: no confirmed dead domains\n' > black.txt
          test -s china.txt || printf '! Validated China list: no validated China domains\n' > china.txt
          printf 'Fresh DNS-validation database initialized on %s\n' "$(date -u +%F)" > dns-validation-bootstrap-complete-v2.txt
          # Seal every published asset so builds cannot mix validation runs.
          python scripts/validated_sources.py seal
          cp .cache/domain/domain-input-provenance.json domain-input-provenance.json
          echo "message=$(date)" >> "$GITHUB_OUTPUT"

      - name: Check DNS validation checkpoint database
        if: always()
        id: checkpoint_database
        run: |
          if [ -s domain.db ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save DNS validation checkpoint for interrupted runs
        if: always() && steps.checkpoint_database.outputs.available == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: domain.db
          key: dns-validation-checkpoint-${{ steps.checkpoint_fingerprint.outputs.value }}-${{ github.run_id }}

      - name: Upload DNS validation audit artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dns-validation-audit-${{ github.run_id }}
          path: |
            blacklist.log
            domain.txt
            domain-input-provenance.json
            black.txt
            china.txt
            /tmp/smartdns/smartdns.log
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Write summary
        if: always()
        run: |
          {
            echo "### DNS Validation State"
            echo "- domain.txt: $(test -f domain.txt && wc -l < domain.txt || echo 0) lines"
            echo "- black.txt: $(test -f black.txt && wc -l < black.txt || echo 0) lines"
            echo "- china.txt: $(test -f china.txt && wc -l < china.txt || echo 0) lines"
            echo "- database: $(test -s domain.db && du -h domain.db | cut -f1 || echo missing)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish validated domain state
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: dns-validation-state
          name: Internal DNS validation state
          body: Internal DNS-validation state used by the production rule build. Not a user-facing rule subscription.
          prerelease: true
          make_latest: false
          files: |
            domain.db
            domain.txt
            domain-input-provenance.json
            validated-dns-sources.tar.gz
            black.txt
            china.txt
            dns-validation-bootstrap-complete-v2.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Verify dns-validation-state release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view dns-validation-state --json assets --jq '.assets[].name')"
          for name in domain.db domain.txt domain-input-provenance.json validated-dns-sources.tar.gz black.txt china.txt dns-validation-bootstrap-complete-v2.txt; do
            if ! grep -Fxq "$name" <<< "$assets"; then
              echo "::error::dns-validation-state release is missing $name"
              exit 1
            fi
          done


