name: Update Filters

permissions:
  contents: write

# 避免连续提交触发多个发布任务并发覆盖 Releases 和 dist。
concurrency:
  # Serialize production builds; DNS-state freshness is checked independently before building.
  group: update-filters-${{ github.repository }}
  cancel-in-progress: false
on:
  # Build-only changes may reuse the current validated DNS state.
  # DNS inputs and validation logic are handled exclusively by blacklist.yml,
  # which dispatches this workflow only after publishing fresh state.
  push:
    branches: [main]
    paths:
      - "adblock.py"
      - "filter.py"
      - "app/**"
      - "rules/filter-exclude.txt"
      - "rules/white.txt"
  # DNS-state workflow validates and publishes fresh state before dispatching production builds.
  # Tests run in audit-sources.yml; test-only changes must not launch release builds.
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

env:
  TZ: Asia/Shanghai
  SINGBOX_VERSION: 1.12.12
  MIHOMO_VERSION: 1.19.16

jobs:
  Update_Filters:
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # workflow_dispatch runs may wait behind the concurrency queue.
          # Use the current main tip, not the stale event SHA captured when queued.
          ref: main

      - name: Checkout domain-list-community
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community
          ref: 98c43cad27fa8f02043858763709fe4a95432ffb

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: domain-list-community/go.mod
          cache-dependency-path: domain-list-community/go.sum

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml', '.github/workflows/update.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gzip
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Static analysis
        run: |
          python -m ruff check --no-cache .
          python -m ruff check --no-cache --select F401 scripts tests

      - name: Run unit tests
        run: |
          python -m py_compile adblock.py blacklist.py updater.py readme.py scripts/audit_sources.py scripts/generate_domain_input.py scripts/verify_critical_domains.py scripts/validated_sources.py
          python -m compileall -q app
          python -m pytest -q tests

      - name: Wait for a complete DNS state matching current inputs
        timeout-minutes: 35
        run: |
          set -euo pipefail
          mkdir -p .cache/domain
          state_files=(
            black.txt
            china.txt
            domain.txt
            domain-input-provenance.json
            dns-validation-bootstrap-complete-v2.txt
            validated-dns-sources.tar.gz
          )
          state_ready=0
          for attempt in $(seq 1 50); do
            for name in "${state_files[@]}"; do
              rm -f ".cache/domain/$name"
            done
            download_ok=1
            for name in "${state_files[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 1 --retry-all-errors --connect-timeout 10 --max-time 120 \
                -o ".cache/domain/$name" \
                "https://github.com/${{ github.repository }}/releases/download/dns-validation-state/$name"; then
                download_ok=0
                break
              fi
              if ! test -s ".cache/domain/$name"; then
                download_ok=0
                break
              fi
            done
            if [ "$download_ok" -eq 1 ] && python scripts/validated_sources.py check-current; then
              state_ready=1
              break
            fi
            echo "Waiting for a complete DNS state matching the current source manifest, validation logic, and myblock.txt ($attempt/50)"
            sleep 30
          done
          if [ "$state_ready" -ne 1 ]; then
            echo "::error::No complete, current DNS validation state was published within 25 minutes."
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced while waiting for DNS validation; refusing to build a stale checkout."
            exit 1
          fi

      - name: Prepare domain inputs
        run: |
          set -euo pipefail
          mkdir -p .cache/domain .cache/source
          : > .cache/domain/input-provenance.txt
          for name in black.txt china.txt domain.txt domain-input-provenance.json dns-validation-bootstrap-complete-v2.txt validated-dns-sources.tar.gz; do
            test -s ".cache/domain/$name" || { echo "::error::Verified DNS validation state asset is missing: $name"; exit 1; }
            printf '%s\t%s\n' "$name" "sealed dual-group DNS validation state" >> .cache/domain/input-provenance.txt
          done
          # Preserve the exact validation input before Filter.generate rewrites domain.txt.
          cp .cache/domain/domain.txt .cache/domain/validated-domain-input.txt
          python scripts/validated_sources.py restore
          cp rules/white.txt .cache/domain/
          cp rules/myblock.txt .cache/source/

      - name: Update Filters
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python adblock.py
          rm -rf __pycache__
          rm -rf app/__pycache__
          echo "message=$(date)" >> $GITHUB_OUTPUT

      - name: Verify critical service domains are not blocked
        run: |
          python scripts/verify_critical_domains.py

      - name: Compare with upstream published DNS baseline
        run: |
          mkdir -p .cache/baseline .cache/report
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -o .cache/baseline/upstream-adblockdns.txt \
            https://github.com/217heidai/adblockfilters/releases/download/rule/adblockdns.txt
          python - <<'PY'
          from pathlib import Path
          import json

          baseline_path = Path(".cache/baseline/upstream-adblockdns.txt")
          baseline_lines = baseline_path.read_text(encoding="utf-8", errors="replace").splitlines()
          baseline_title = next((line for line in baseline_lines if line.startswith("! Title:")), None)
          baseline_version = next((line.partition(": ")[2] for line in baseline_lines if line.startswith("! Version:")), "")
          baseline_rules = [
              line.strip()
              for line in baseline_lines
              if line.strip() and not line.lstrip().startswith(("!", "#"))
          ]
          if baseline_title != "! Title: AdBlock DNS":
              raise SystemExit(f"Unexpected upstream baseline title: {baseline_title!r}")
          if not baseline_version:
              raise SystemExit("Upstream baseline is missing its version marker")
          if len(baseline_rules) < 100000:
              raise SystemExit(f"Upstream baseline is unexpectedly small: {len(baseline_rules)} rules")
          invalid_rules = [
              line for line in baseline_rules
              if not line.startswith(("||", "@@||"))
          ]
          if invalid_rules:
              raise SystemExit(
                  "Upstream DNS baseline contains unsupported lines: "
                  + ", ".join(invalid_rules[:10])
              )

          def read(path):
              return {
                  line.strip()
                  for line in Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
                  if line.strip() and not line.lstrip().startswith(("!", "#"))
              }

          current = read(".cache/out/adblockdns.txt")
          baseline = set(baseline_rules)
          if not current:
              raise SystemExit("Compiled DNS output is empty; baseline comparison is unsafe")

          optimized_only = sorted(current - baseline)
          baseline_only = sorted(baseline - current)
          report = {
              "baseline": "217heidai/adblockfilters release rule/adblockdns.txt",
              "baseline_title": baseline_title,
              "baseline_version": baseline_version,
              "baseline_rules": len(baseline),
              "optimized_rules": len(current),
              "shared_rules": len(current & baseline),
              "optimized_only": len(optimized_only),
              "baseline_only": len(baseline_only),
              "optimized_only_sample": optimized_only[:100],
              "baseline_only_sample": baseline_only[:100],
          }
          Path(".cache/report/comparison.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path(".cache/report/optimized-only.txt").write_text(
              "\n".join(optimized_only)
              + ("\n" if optimized_only else "! No project-only rules in this comparison.\n"),
              encoding="utf-8",
          )
          Path(".cache/report/baseline-only.txt").write_text(
              "\n".join(baseline_only)
              + ("\n" if baseline_only else "! No upstream-only rules in this comparison.\n"),
              encoding="utf-8",
          )
          lines = [
              "# DNS output comparison",
              "",
              f"- Baseline version: {baseline_version}",
              f"- Baseline rules: {len(baseline)}",
              f"- Optimized rules: {len(current)}",
              f"- Shared: {len(current & baseline)}",
              f"- Optimized-only: {len(optimized_only)}",
              f"- Baseline-only: {len(baseline_only)}",
              "",
          ]
          Path(".cache/report/comparison.md").write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Audit upstream source contribution (whitelist-aware)
        run: |
          python scripts/audit_sources.py

      - name: Check whitelist regression (Full and Lite)
        run: |
          python - <<'PY'
          from pathlib import Path

          whitelist = []
          for raw in Path("rules/white.txt").read_text(encoding="utf-8").splitlines():
              domain = raw.strip()
              if not domain or domain.startswith("#"):
                  continue
              if domain.startswith("@@||"):
                  domain = domain[4:]
              elif domain.startswith("||"):
                  domain = domain[2:]
              # Modifier-bearing exceptions (e.g. $third-party) are scoped browser
              # rules, not DNS-wide whitelist entries; never widen them here.
              if "$" in domain:
                  continue
              if "^" in domain:
                  domain = domain.split("^", 1)[0]
              # Browser paths, wildcards and incomplete domains are not DNS-domain exceptions.
              if (not domain or domain.endswith(".") or
                      any(ch in domain for ch in "*/#|?^$")):
                  continue
              whitelist.append(domain)

          failures = []
          for output_name in ("adblockdns.txt", "adblockdnslite.txt"):
              output_path = Path(".cache/out") / output_name
              output = output_path.read_text(encoding="utf-8")
              blocked_exact, blocked_suffix = set(), set()
              allowed_exact, allowed_suffix = set(), set()
              for raw in output.splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("!", "#")):
                      continue
                  if line.startswith("@@||") and line.endswith("^"):
                      allowed_suffix.add(line[4:-1].strip())
                  elif line.startswith("@@"):
                      allowed_exact.add(line[2:].strip())
                  elif line.startswith("||") and line.endswith("^"):
                      blocked_suffix.add(line[2:-1].strip())
                  elif "." in line and not any(ch in line for ch in " /\t^$*"):
                      blocked_exact.add(line)
              for domain in whitelist:
                  covered = (
                      domain in blocked_exact
                      or any(domain == item or domain.endswith("." + item) for item in blocked_suffix)
                  )
                  excepted = (
                      domain in allowed_exact
                      or any(domain == item or domain.endswith("." + item) for item in allowed_suffix)
                  )
                  if covered and not excepted:
                      failures.append((output_name, domain))

          if failures:
              for output_name, domain in failures:
                  print(f"whitelist regression: {domain} remains blocked by {output_name}")
              raise SystemExit(1)
          print("whitelist regression: Full and Lite passed")
          PY

      - name: Write summary
        if: always()
        run: |
          {
            echo "### 生成结果"
            echo "- adblockdns.txt: $(test -f .cache/out/adblockdns.txt && wc -l < .cache/out/adblockdns.txt || echo 0) 条"
            echo "- adblockfilters.txt: $(test -f .cache/out/adblockfilters.txt && wc -l < .cache/out/adblockfilters.txt || echo 0) 条"
            echo "- 白名单: $(grep -vc '^#\|^$' rules/white.txt 2>/dev/null || echo 0) 条"
          } >> $GITHUB_STEP_SUMMARY

      - name: Compile Sing-Box filters
        run: |
          wget https://github.com/SagerNet/sing-box/releases/download/v${{env.SINGBOX_VERSION}}/sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz
          echo '7c103cb2f9a7dc54cb82962043596718ed27989a478d6405f0939a9b775f889f  sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz' | sha256sum -c -
          tar -zxvf sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz
          chmod +x sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box
          ./sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box rule-set compile --output .cache/out/adblocksingbox.srs     .cache/out/adblocksingbox.json
          ./sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box rule-set compile --output .cache/out/adblocksingboxlite.srs .cache/out/adblocksingboxlite.json
          rm -rf sing-box*

      - name: Compile mihomo filters
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v${{env.MIHOMO_VERSION}}/mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz
          echo 'd06f37a21df275bc36002b98ad35835caf9ac1b1c4cb3fad750fd2b3f94617fe  mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz' | sha256sum -c -
          gzip -d mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz
          chmod +x mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}
          ./mihomo-linux-amd64-v${{env.MIHOMO_VERSION}} convert-ruleset domain yaml .cache/out/adblockmihomo.yaml     .cache/out/adblockmihomo.mrs
          ./mihomo-linux-amd64-v${{env.MIHOMO_VERSION}} convert-ruleset domain yaml .cache/out/adblockmihomolite.yaml .cache/out/adblockmihomolite.mrs
          rm -rf mihomo*

      - name: Compile v2ray/xray filters
        run: |
          mkdir -p domain-list-community/adblock
          cp .cache/out/adblockv2ray.txt domain-list-community/adblock/category-ads-all
          cd domain-list-community
          go run ./ --datapath=adblock
          cd ..
          cp domain-list-community/dlc.dat .cache/out/adblockv2ray.dat
          mkdir -p domain-list-community/adblocklite
          cp .cache/out/adblockv2raylite.txt domain-list-community/adblocklite/category-ads-all
          cd domain-list-community
          go run ./ --datapath=adblocklite
          cd ..
          cp domain-list-community/dlc.dat .cache/out/adblockv2raylite.dat
          rm -rf domain-list-community
          # These plain-text files are internal inputs for DAT compilation, not published client formats.
          test -s .cache/out/adblockv2ray.dat
          test -s .cache/out/adblockv2raylite.dat
          rm -f .cache/out/adblockv2ray.txt .cache/out/adblockv2raylite.txt

      - name: Validate complete client output matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          output = Path(".cache/out")
          expected = {
              "adblockdns.txt", "adblockdnslite.txt",
              "adblockfilters.txt", "adblockfilterslite.txt",
              "adblockdomain.txt", "adblockdomainlite.txt", "adblockdomainallow.txt",
              "adblockdnsmasq.txt", "adblockdnsmasqlite.txt",
              "adblocksmartdns.conf", "adblocksmartdnslite.conf",
              "adblockclash.list", "adblockclashlite.list",
              "adblockshadowrocket.sgmodule", "adblockshadowrocketlite.sgmodule",
              "adblockqx.conf", "adblockqxlite.conf",
              "adblockmihomo.yaml", "adblockmihomolite.yaml",
              "adblockmihomo.mrs", "adblockmihomolite.mrs",
              "adblockhosts.txt", "adblockhostslite.txt",
              "adblocksingbox.json", "adblocksingboxlite.json",
              "adblocksingbox.srs", "adblocksingboxlite.srs",
              "adblockloon.list", "adblockloonlite.list",
              "adblocksurge.list", "adblocksurgelite.list",
              "adblockmosdns.txt", "adblockmosdnslite.txt",
              "adblockv2ray.dat", "adblockv2raylite.dat",
          }
          if not output.is_dir():
              raise SystemExit("Compiled output directory is missing")
          actual = {path.name for path in output.iterdir() if path.is_file()}
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          empty = sorted(name for name in expected & actual if (output / name).stat().st_size == 0)
          if missing or unexpected or empty:
              raise SystemExit(
                  f"Client output matrix invalid: missing={missing}, unexpected={unexpected}, empty={empty}"
              )
          for name in ("adblocksingbox.json", "adblocksingboxlite.json"):
              json.loads((output / name).read_text(encoding="utf-8"))

          readme = Path("README.md").read_text(encoding="utf-8")
          subscriptions = re.findall(
              r"\[原始链接\]\(https://raw\.githubusercontent\.com/[^/]+/[^/]+/dist/([^)]+)\)",
              readme,
          )
          if len(subscriptions) != len(expected) or set(subscriptions) != expected:
              raise SystemExit(
                  f"README direct subscription manifest mismatch: count={len(subscriptions)}, "
                  f"missing={sorted(expected - set(subscriptions))}, "
                  f"unexpected={sorted(set(subscriptions) - expected)}"
              )
          print(f"Validated {len(expected)} client outputs and matching direct README subscriptions.")
          PY

      - name: Validate audit report assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = (Path(".cache/audit"), Path(".cache/report"))
          for root in roots:
              if not root.exists():
                  raise SystemExit(f"Required report directory is missing: {root}")
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix == ".txt" and path.stat().st_size == 0:
                      path.write_text("! No entries matched this report.\n", encoding="utf-8")
                  elif path.suffix in {".md", ".json"} and path.stat().st_size == 0:
                      raise SystemExit(f"Required report is empty: {path}")
                  if path.suffix == ".json":
                      try:
                          json.loads(path.read_text(encoding="utf-8"))
                      except Exception as exc:
                          raise SystemExit(f"Invalid JSON report {path}: {exc}")
          print("Audit report assets are present, non-empty, and valid.")
          PY

      - name: Upload build and comparison artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adblock-dns-build
          path: |
            .cache/out/*
            .cache/report/*
            .cache/audit/*
          retention-days: 14
          if-no-files-found: error

      - name: Upload rules to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: rule
          files: .cache/out/*
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Remove internal V2Ray text assets from rule release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in adblockv2ray.txt adblockv2raylite.txt; do
            if gh release view rule --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset rule "$asset" --yes
            fi
          done

      - name: Upload sources to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: source
          files: .cache/source/*
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Remove obsolete source release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # These files belonged to removed source configurations or audit-only candidates.
          for asset in AWAvenue_Ads_Rule.txt OISD_Basic.txt Pollock_hosts.txt Pollock_hosts_.candidate_only.txt; do
            if gh release view source --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset source "$asset" --yes
            fi
          done

      - name: Publish source audit and baseline comparison reports
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: audit
          files: |
            .cache/audit/source-audit.md
            .cache/audit/source-audit.json
            .cache/audit/whitelist-coverage.json
            .cache/audit/whitelist-unused.txt
            .cache/audit/lite-scope-audit.json
            .cache/audit/lite-scope-known-non-china-covered.txt
            .cache/audit/lite-scope-china-domains-missing.txt
            .cache/audit/lite-scope-rules-not-classified-china.txt
            .cache/audit/lite-scope-unvalidated-source-domains.txt
            .cache/audit/lite-scope-invizible-known-non-china-covered.txt
            .cache/audit/lite-scope-invizible-china-domains-missing.txt
            .cache/audit/lite-scope-invizible-rules-not-classified-china.txt
            .cache/audit/invizible-allowlist-audit.json
            .cache/audit/invizible-allowlist-missing.txt
            .cache/audit/baseline-browser-analysis.json
            .cache/audit/baseline-only-browser-overlap.txt
            .cache/audit/baseline-only-allow-exceptions-still-blocked.txt
            .cache/audit/baseline-only-allow-exceptions-no-longer-needed.txt
            .cache/audit/baseline-only-no-browser-overlap.txt
            .cache/audit/baseline-only-current-dns-source-overlap.txt
            .cache/audit/baseline-only-current-source-allow-covered.txt
            .cache/audit/baseline-only-current-source-parent-inactive.txt
            .cache/audit/baseline-only-current-source-parent-inactive-blacklisted.txt
            .cache/audit/baseline-only-current-source-parent-inactive-whitelisted.txt
            .cache/audit/baseline-only-current-source-parent-inactive-allowed.txt
            .cache/audit/baseline-only-current-blacklist-overlap.txt
            .cache/audit/baseline-only-current-whitelist-covered.txt
            .cache/audit/baseline-only-current-source-unexplained.txt
            .cache/audit/baseline-only-not-effectively-covered-by-current-dns.txt
            .cache/audit/baseline-only-absent-from-current-dns-sources.txt
            .cache/report/comparison.md
            .cache/report/comparison.json
            .cache/report/optimized-only.txt
            .cache/report/baseline-only.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Remove obsolete audit report assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in baseline-only-browser-explained.txt baseline-only-not-browser-explained.txt baseline-only-not-current-dns-source.txt; do
            if gh release view audit --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset audit "$asset" --yes
            fi
          done

      - name: Upload domain backup
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: domain
          files: .cache/domain/domain.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Refuse to publish if main advanced during the build
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced during the build; refusing to publish stale output."
            exit 1
          fi

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: ${{ steps.update.outputs.message }}

      - name: Publish to dist branch
        # 必须放在 Commit Changes 之后：孤儿分支切换会清空工作区（含刚生成的 README），
        # 若放前面，README 更新会丢失。dist 为孤儿分支，每轮 force-push 单提交，不产生历史。
        run: |
          set -euo pipefail
          build_main_sha="$(git rev-parse HEAD)"
          cp -r .cache/out /tmp/dist-out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git fetch origin main
          if [ "$build_main_sha" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced before dist publication; refusing to publish stale output."
            exit 1
          fi
          git rm -rf . || true
          # git rm 只删已跟踪文件，.gitignore 也被删了，未跟踪的 .cache/ 会留下来并被 git add -A 收入；
          # clean 掉所有未跟踪文件（runner 用完即弃，此步已是任务最后一步），只留刚拷入的产物
          git clean -fdx
          cp /tmp/dist-out/* .
          git add -A
          [ -n "$(git status --porcelain)" ] || exit 0
          git commit -m "Publish rules $(date -u +%Y%m%d%H%M)"
          git push -f origin dist

