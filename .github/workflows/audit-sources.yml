name: Audit upstream sources

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'app/**'
      - 'requirements.txt'
      - '.editorconfig'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/audit-sources.yml'
      - 'README.md'
      - 'resolver.py'
      - 'readme.py'
      - 'blacklist.py'
      - 'adblock.py'
      - 'updater.py'
      - 'smartdns.conf'
      - '.gitignore'
      - '.github/workflows/blacklist.yml'
      - '.github/workflows/update.yml'
      - 'filter.py'
      - 'rules/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-upstream-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Static analysis
        run: |
          python -m ruff check --no-cache .
          python -m ruff check --no-cache --select F401 scripts tests
          python -m ruff check --no-cache --select E4,E7,E9,F scripts tests readme.py
      - name: Run regression tests
        run: |
          python -m py_compile resolver.py blacklist.py scripts/audit_sources.py scripts/generate_domain_input.py scripts/validated_sources.py scripts/verify_critical_domains.py scripts/compare_baseline.py
          python -m compileall -q app
          python -m pytest -q tests
      - name: Audit source lists with current resolver
        run: python scripts/audit_sources.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-source-audit
          path: .cache/audit/
          if-no-files-found: warn
          retention-days: 14
