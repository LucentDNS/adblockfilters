name: Audit upstream sources

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'app/**'
      - 'requirements.txt'
      - '.editorconfig'
      - '.gitattributes'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/audit-sources.yml'
      - 'README.md'
      - 'sources.json'
      - 'source-policy.json'
      - 'source-licenses.json'
      - 'licenses/**'
      - 'THIRD-PARTY-NOTICES.md'
      - 'resolver.py'
      - 'readme.py'
      - 'blacklist.py'
      - 'adblock.py'
      - 'updater.py'
      - 'smartdns.conf'
      - '.gitignore'
      - '.github/workflows/blacklist.yml'
      - '.github/workflows/update.yml'
      - 'filter.py'
      - 'rules/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-upstream-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Probe alternate domestic public resolvers from runner network
        continue-on-error: true
        run: |
          python - <<'PY'
          import dns.resolver
          from dns.resolver import NXDOMAIN

          candidates = {
              "CNNIC-210.2.4.8": "210.2.4.8",
              "114DNS-114.114.114.114": "114.114.114.114",
              "114DNS-114.114.115.115": "114.114.115.115",
              "AliDNS-223.5.5.5": "223.5.5.5",
              "AliDNS-223.6.6.6": "223.6.6.6",
              "ByteDance-180.184.1.1": "180.184.1.1",
          }
          for name, address in candidates.items():
              resolver = dns.resolver.Resolver(configure=False)
              resolver.nameservers = [address]
              resolver.port = 53
              resolver.timeout = 2
              resolver.lifetime = 4
              positive = []
              for domain in ("baidu.com", "qq.com", "example.com"):
                  try:
                      if resolver.resolve(domain, "A"):
                          positive.append(domain)
                  except Exception as exc:
                      print(f"{name} positive {domain}: {type(exc).__name__}: {exc}")
              negative = []
              for rdtype in ("A", "AAAA"):
                  try:
                      resolver.resolve("adblock-dns-probe-20261125.example.invalid", rdtype)
                  except NXDOMAIN:
                      negative.append(rdtype)
                  except Exception as exc:
                      print(f"{name} negative {rdtype}: {type(exc).__name__}: {exc}")
              passed = len(positive) >= 2 and len(negative) == 2
              print(f"RESOLVER_PROBE {name} {address} positive={positive} negative={negative} result={'PASS' if passed else 'FAIL'}")
          PY
      - name: Compare candidate resolvers against a real DNS-validation sample
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/dns-candidate
          gh release download dns-validation-state --pattern domain.db --dir .cache/dns-candidate
          python - <<'PY'
          import random
          import sqlite3
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import dns.resolver
          from dns.resolver import NXDOMAIN, NoAnswer, NoNameservers

          database = ".cache/dns-candidate/domain.db"
          with sqlite3.connect(database) as connection:
              domains = [
                  row[0] for row in connection.execute(
                      """
                      SELECT domain FROM T_DOMAIN
                      WHERE isBlock = 0
                      ORDER BY RANDOM()
                      LIMIT 200
                      """
                  ).fetchall()
              ]
          if len(domains) < 100:
              raise SystemExit(f"Insufficient DNS validation sample: {len(domains)}")

          candidates = {
              "AliDNS-223.6.6.6": "223.6.6.6",
              "114DNS-114.114.114.114": "114.114.114.114",
              "CNNIC-210.2.4.8": "210.2.4.8",
          }

          def inspect(address, domain):
              statuses = []
              for rdtype in ("A", "AAAA"):
                  resolver = dns.resolver.Resolver(configure=False)
                  resolver.nameservers = [address]
                  resolver.port = 53
                  resolver.timeout = 1.5
                  resolver.lifetime = 3
                  try:
                      answer = resolver.resolve(domain, rdtype)
                      statuses.append("answer" if len(answer) else "no_answer")
                  except NXDOMAIN:
                      statuses.append("nxdomain")
                  except NoAnswer:
                      statuses.append("no_answer")
                  except NoNameservers:
                      statuses.append("servfail")
                  except Exception as exc:
                      statuses.append(type(exc).__name__)
              if "answer" in statuses:
                  return "resolved"
              if statuses == ["nxdomain", "nxdomain"]:
                  return "nxdomain"
              if all(status in ("nxdomain", "no_answer") for status in statuses):
                  return "no_address"
              return "unknown"

          for name, address in candidates.items():
              counts = {"resolved": 0, "nxdomain": 0, "no_address": 0, "unknown": 0}
              with ThreadPoolExecutor(max_workers=32) as pool:
                  futures = [pool.submit(inspect, address, domain) for domain in domains]
                  for future in as_completed(futures):
                      counts[future.result()] += 1
              print(
                  f"REAL_SAMPLE {name} {address} n={len(domains)} "
                  f"resolved={counts['resolved']} nxdomain={counts['nxdomain']} "
                  f"no_address={counts['no_address']} unknown={counts['unknown']}"
              )
          PY
      - name: Static analysis
        run: |
          python -m ruff check --no-cache .
          python -m ruff check --no-cache --select F401 scripts tests
          python -m ruff check --no-cache --select E4,E7,E9,F scripts tests readme.py
      - name: Run regression tests
        run: |
          python -m py_compile resolver.py blacklist.py scripts/audit_sources.py scripts/build_licenses.py scripts/generate_domain_input.py scripts/validated_sources.py scripts/verify_critical_domains.py scripts/compare_baseline.py scripts/verify_hostlist_compiler.py
          python -m compileall -q app
          python -m pytest -q tests
      - name: Audit source lists with current resolver
        run: python scripts/audit_sources.py
      - name: Package third-party license notices with audit evidence
        run: python scripts/build_licenses.py --audit-dir .cache/audit
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-source-audit
          path: .cache/audit/
          if-no-files-found: warn
          retention-days: 14
