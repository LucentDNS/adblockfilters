name: Generate DNS State

# Only DNS inputs and validation logic trigger a fresh state; documentation is not DNS input.
# Keep the schedule regression test aligned with this workflow's Beijing-time cron.
permissions:
  contents: write
  actions: write

concurrency:
  # Latest-run-wins for DNS validation; production builds use a separate concurrency group.
  group: dns-validation-state-${{ github.repository }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Daily at 16:43 Beijing time (08:43 UTC); stagger away from common scheduler peak times.
    - cron: '43 8 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/blacklist.yml
      - blacklist.py
      - smartdns.conf
      - resolver.py
      - readme.py
      - updater.py
      - sources.json
      - requirements.txt
      - scripts/generate_domain_input.py
      - scripts/validated_sources.py
      - scripts/review_baseline_only.py
      - rules/myblock.txt

env:
  TZ: Asia/Shanghai
  SMARTDNS_URL: https://github.com/pymumu/smartdns/releases/download/Release48.4/smartdns.1.2026.08.05-0921.x86_64-debian-all.deb
  SMARTDNS_PATH: /tmp/smartdns

jobs:
  Generate_Domain_State:
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Static analysis
        run: |
          set -euo pipefail
          python -m ruff check --no-cache .
          python -m ruff check --no-cache --select F401 scripts tests

      - name: Run DNS resolver regression tests
        run: |
          set -euo pipefail
          python -m py_compile blacklist.py
          python -m pytest -q tests

      - name: Setup SmartDNS
        run: |
          set -euo pipefail
          mkdir -p "${SMARTDNS_PATH}"
          curl -fsSL "${SMARTDNS_URL}" -o /tmp/smartdns.deb
          echo "${SMARTDNS_SHA256}  /tmp/smartdns.deb" | sha256sum -c -
          dpkg-deb -x /tmp/smartdns.deb "${SMARTDNS_PATH}"
          find "${SMARTDNS_PATH}" -type f -name smartdns -exec chmod +x {} \;
          find "${SMARTDNS_PATH}" -type f -name smartdns -print -quit | grep -q .

      - name: Verify all five SmartDNS upstreams independently
        run: |
          set -euo pipefail
          python scripts/verify_dns_upstreams.py

      - name: Download database
        run: |
          set -euo pipefail
          python blacklist.py --download-database

      - name: Generate DNS validation input from configured DNS sources
        run: |
          set -euo pipefail
          python scripts/generate_domain_input.py

      - name: Run DNS validation and generate independent blacklist
        run: |
          set -euo pipefail
          python blacklist.py

      - name: Review legacy upstream-only domains with all five DNS upstreams
        run: |
          set -euo pipefail
          python scripts/review_baseline_only.py

      - name: Publish legacy baseline DNS review to audit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/publish_baseline_review.py

      - name: Verify legacy baseline DNS review assets
        run: |
          set -euo pipefail
          python scripts/verify_baseline_review.py

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: dns-validation-state-log
          path: blacklist.log
          if-no-files-found: warn

      - name: Write summary
        if: always()
        run: |
          {
            echo "### DNS Validation State"
            echo "- domain.txt: $(test -f domain.txt && wc -l < domain.txt || echo 0) lines"
            echo "- black.txt: $(test -f black.txt && wc -l < black.txt || echo 0) lines"
            echo "- china.txt: $(test -f china.txt && wc -l < china.txt || echo 0) lines"
            echo "- database: $(test -s domain.db && du -h domain.db | cut -f1 || echo missing)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish validated domain state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/validated_sources.py publish

      - name: Verify dns-validation-state release assets
        if: success()
        run: |
          set -euo pipefail
          python scripts/validated_sources.py verify

      - name: Trigger production rule build after dns-validation-state publication
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run update.yml --ref main
          echo "Triggered production rule build."
