name: Update Filters

permissions:
  contents: write
  pull-requests: read

# 避免连续提交触发多个发布任务并发覆盖 Releases 和 dist。
concurrency:
  # Latest-run-wins: newer builds cancel older ones; the main-SHA guard protects publication.
  group: update-filters-${{ github.repository }}
  cancel-in-progress: true
on:
  schedule:
    # Daily production build at 16:43 Beijing time (08:43 UTC).
    - cron: '43 8 * * *'
  # Build directly from freshly downloaded upstream sources; DNS checks are auxiliary only.
  push:
    branches: [main]
    paths:
      - "adblock.py"
      - "filter.py"
      - "app/**"
      - "rules/filter-exclude.txt"
      - "rules/white.txt"
      - "scripts/compare_baseline.py"
      - "scripts/check_source_anomalies.py"
      - "scripts/verify_hostlist_compiler.py"
      - "scripts/verify_critical_domains.py"
      - "scripts/audit_sources.py"
      - "source-policy.json"
      - "source-licenses.json"
      - "licenses/**"
      - "THIRD-PARTY-NOTICES.md"
      - "scripts/build_licenses.py"
      - ".github/workflows/update.yml"
      - "README.md"
      - "sources.json"
      - "rules/myblock.txt"
      - "updater.py"
      - "resolver.py"
      - "readme.py"
      - "requirements.txt"
  # DNS diagnostics never dispatch or gate production builds.
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  Update_Filters:
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A newer dispatch may supersede an in-flight build.
          # Always use the current main tip, not the stale event SHA.
          ref: main

      - name: Remove unsupported legacy client assets from rule release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${REPOSITORY}/releases/tags/rule" --jq '.id')"
          if [[ -z "${release_id}" || "${release_id}" == "null" ]]; then
            echo "::error::The existing rule release could not be identified; refusing an unscoped cleanup."
            exit 1
          fi

          asset_rows="$(gh api --paginate "repos/${REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[] | [.name, (.id | tostring)] | @tsv')"
          while read -r asset_name asset_id; do
            [[ -n "${asset_name}" ]] || continue
            case "${asset_name}" in
              adblockdns.txt|adblockdnslite.txt|adblockfilters.txt|adblockfilterslite.txt|LICENSE-GPL-3.0.txt|LICENSE-LGPL-3.0.txt|LICENSE-MIT-anti-AD.txt|LICENSE-MIT-StevenBlack.txt|LICENSE-MPL-2.0-1Hosts.txt|THIRD-PARTY-NOTICES.md|source-licenses.json)
                ;;
              *)
                echo "Removing unsupported legacy release asset: ${asset_name}"
                gh api --method DELETE "repos/${REPOSITORY}/releases/assets/${asset_id}"
                ;;
            esac
          done <<< "${asset_rows}"

      - name: Remove merged and superseded work branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches="$(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')"
          open_refs="$(gh api --paginate "repos/${REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].head.ref')"
          merged_refs="$(gh api --paginate "repos/${REPOSITORY}/pulls?state=closed&per_page=100" | jq -r --arg repo "${REPOSITORY}" '.[] | select(.merged_at != null and .head.repo.full_name == $repo) | .head.ref')"
          # These closed, unmerged branches are explicitly superseded:
          # PR #22 by merged PR #23; PR #29 by merged PRs #31 and #33. DNS/CNNIC experiments are superseded by the validated main-branch resolver and cache policy.
          superseded_refs="fix/dns-dnstype-rule-preservation fix/source-policy-conflict-audit diagnostics/domestic-resolver-shortlist fix/cnnic-dns-upstream-and-cache-migration fix/cnnic-dns-upstream-and-cache-migration-v2 diagnostics/cnnic-secondary-endpoint qa/independent-dns-group-regression fix/dns-checkpoint-cache-compatibility"
          deleted=0
          while IFS= read -r branch_name; do
            [[ -n "${branch_name}" ]] || continue
            [[ "${branch_name}" == "main" || "${branch_name}" == "dist" ]] && continue
            if grep -Fxq "${branch_name}" <<< "${open_refs}"; then
              echo "Keeping ${branch_name}: an open PR still uses it."
              continue
            fi
            if grep -Fxq "${branch_name}" <<< "${merged_refs}" || [[ " ${superseded_refs} " == *" ${branch_name} "* ]]; then
              if gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch_name}"; then
                echo "Deleted obsolete branch: ${branch_name}"
                deleted=$((deleted + 1))
              else
                echo "::warning::Could not delete obsolete branch: ${branch_name}"
              fi
            else
              echo "Keeping ${branch_name}: no merged PR or explicit supersession evidence."
            fi
          done <<< "${branches}"
          echo "Deleted ${deleted} obsolete branches; main and dist were retained."

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml', '.github/workflows/update.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gzip
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Static analysis
        run: |
          python -m ruff check --no-cache .
          python -m ruff check --no-cache --select F401 scripts tests

      - name: Run unit tests
        run: |
          python -m py_compile adblock.py blacklist.py updater.py readme.py scripts/audit_sources.py scripts/generate_domain_input.py scripts/verify_critical_domains.py scripts/validated_sources.py scripts/compare_baseline.py scripts/check_source_anomalies.py scripts/verify_hostlist_compiler.py
          python -m compileall -q app
          python -m pytest -q tests

      - name: Prepare verified DNS classification inputs for Lite
        run: |
          set -euo pipefail
          mkdir -p .cache/domain .cache/source
          state_url="https://github.com/${{ github.repository }}/releases/download/dns-validation-state"
          # Consume the last successfully sealed DNS state; do not wait for the
          # independent weekly DNS workflow and never fall back to an empty Lite.
          for asset in black.txt china.txt domain.txt domain-input-provenance.json \
            validated-dns-sources.tar.gz dns-validation-bootstrap-complete-v2.txt; do
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 15 --max-time 180 \
              -o ".cache/domain/$asset" "$state_url/$asset"
          done
          # Verify that all classification files belong to one sealed run and
          # that its source manifest, myblock input, and validation logic still match.
          python scripts/validated_sources.py check-current
          # Keep the validated candidate input and China classification for Lite
          # auditing/building, but DNS NXDOMAIN remains diagnostic-only for Full.
          mv .cache/domain/black.txt .cache/domain/validated-black.txt
          printf '! DNS NXDOMAIN is diagnostic only; do not delete upstream rules.\n' > .cache/domain/black.txt
          cp rules/white.txt .cache/domain/
          cp rules/myblock.txt .cache/source/
          printf 'black.txt\tdisabled: DNS NXDOMAIN is not used to delete upstream rules\nchina.txt\tverified sealed DNS classification for Lite only\ndomain.txt\tmatching sealed DNS validation candidate input\n' > .cache/domain/input-provenance.txt

      - name: Restore previous upstream snapshots for anomaly checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .cache/previous-source
          gh release download source --dir .cache/previous-source
          if ! find .cache/previous-source -maxdepth 1 -type f -name '*.txt' -print -quit | grep -q .; then
            echo "::error::Previous upstream source snapshots are missing; refusing an unguarded build."
            exit 1
          fi

      - name: Update Filters
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python adblock.py
          rm -rf __pycache__
          rm -rf app/__pycache__
          echo "message=$(date)" >> $GITHUB_OUTPUT

      - name: Package third-party licenses with published artifacts
        run: python scripts/build_licenses.py --out-dir .cache/out --source-dir .cache/source

      - name: Set up Node.js for AdGuard DNS syntax validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate Full and Lite DNS filters with AdGuard Hostlist Compiler
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts @adguard/hostlist-compiler@2.1.1
          for variant in full lite; do
            if [[ "$variant" == "full" ]]; then
              input_file=".cache/out/adblockdns.txt"
            else
              input_file=".cache/out/adblockdnslite.txt"
            fi
            config_file=".adguard-hostlist-compiler-$variant.json"
            validated_file=".cache/out/.adguard-hostlist-compiler-$variant.txt"
            cat > "$config_file" <<EOF
          {
            "name": "AdBlock DNS $variant",
            "sources": [
              {
                "name": "Generated DNS filter",
                "source": "$input_file",
                "type": "adblock",
                "transformations": ["Validate"]
              }
            ],
            "transformations": ["Deduplicate"]
          }
          EOF
            hostlist-compiler --config "$config_file" --output "$validated_file"
            python scripts/verify_hostlist_compiler.py \
              --input "$input_file" \
              --validated "$validated_file"
            rm -f "$config_file" "$validated_file"
          done

      - name: Check upstream source size anomalies
        run: |
          python scripts/check_source_anomalies.py \
            --previous .cache/previous-source \
            --current .cache/source

      - name: Verify critical service domains are not blocked
        run: |
          python scripts/verify_critical_domains.py

      - name: Compare with upstream published DNS baseline
        run: |
          set -euo pipefail
          mkdir -p .cache/baseline .cache/report
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -o .cache/baseline/upstream-adblockdns.txt \
            https://github.com/217heidai/adblockfilters/releases/download/rule/adblockdns.txt
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -o .cache/baseline/upstream-adblockdnslite.txt \
            https://github.com/217heidai/adblockfilters/releases/download/rule/adblockdnslite.txt
          python scripts/compare_baseline.py

      - name: Audit upstream source contribution (whitelist-aware)
        run: |
          python scripts/audit_sources.py

      - name: Check whitelist regression (Full and Lite)
        run: |
          python - <<'PY'
          from pathlib import Path

          whitelist = []
          for raw in Path("rules/white.txt").read_text(encoding="utf-8").splitlines():
              domain = raw.strip()
              if not domain or domain.startswith("#"):
                  continue
              if domain.startswith("@@||"):
                  domain = domain[4:]
              elif domain.startswith("||"):
                  domain = domain[2:]
              # Modifier-bearing exceptions (e.g. $third-party) are scoped browser
              # rules, not DNS-wide whitelist entries; never widen them here.
              if "$" in domain:
                  continue
              if "^" in domain:
                  domain = domain.split("^", 1)[0]
              # Browser paths, wildcards and incomplete domains are not DNS-domain exceptions.
              if (not domain or domain.endswith(".") or
                      any(ch in domain for ch in "*/#|?^$")):
                  continue
              whitelist.append(domain)

          failures = []
          for output_name in ("adblockdns.txt", "adblockdnslite.txt"):
              output_path = Path(".cache/out") / output_name
              output = output_path.read_text(encoding="utf-8")
              blocked_exact, blocked_suffix = set(), set()
              allowed_exact, allowed_suffix = set(), set()
              for raw in output.splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("!", "#")):
                      continue
                  if line.startswith("@@||") and line.endswith("^"):
                      allowed_suffix.add(line[4:-1].strip())
                  elif line.startswith("@@"):
                      allowed_exact.add(line[2:].strip())
                  elif line.startswith("||") and line.endswith("^"):
                      blocked_suffix.add(line[2:-1].strip())
                  elif "." in line and not any(ch in line for ch in " /\t^$*"):
                      blocked_exact.add(line)
              for domain in whitelist:
                  covered = (
                      domain in blocked_exact
                      or any(domain == item or domain.endswith("." + item) for item in blocked_suffix)
                  )
                  excepted = (
                      domain in allowed_exact
                      or any(domain == item or domain.endswith("." + item) for item in allowed_suffix)
                  )
                  if covered and not excepted:
                      failures.append((output_name, domain))

          if failures:
              for output_name, domain in failures:
                  print(f"whitelist regression: {domain} remains blocked by {output_name}")
              raise SystemExit(1)
          print("whitelist regression: Full and Lite passed")
          PY

      - name: Write summary
        if: always()
        run: |
          {
            echo "### 生成结果"
            echo "- adblockdns.txt: $(test -f .cache/out/adblockdns.txt && wc -l < .cache/out/adblockdns.txt || echo 0) 条"
            echo "- adblockfilters.txt: $(test -f .cache/out/adblockfilters.txt && wc -l < .cache/out/adblockfilters.txt || echo 0) 条"
            echo "- 白名单: $(grep -vc '^#\|^$' rules/white.txt 2>/dev/null || echo 0) 条"
          } >> $GITHUB_STEP_SUMMARY

      - name: Validate AdGuard product outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          output = Path(".cache/out")
          expected = {
              "adblockdns.txt", "adblockdnslite.txt",
              "adblockfilters.txt", "adblockfilterslite.txt",
          }
          license_artifacts = {
              "LICENSE-GPL-3.0.txt",
              "LICENSE-LGPL-3.0.txt",
              "LICENSE-MIT-anti-AD.txt",
              "LICENSE-MIT-StevenBlack.txt",
              "LICENSE-MPL-2.0-1Hosts.txt",
              "THIRD-PARTY-NOTICES.md",
              "source-licenses.json",
          }
          if not output.is_dir():
              raise SystemExit("Compiled output directory is missing")
          actual = {path.name for path in output.iterdir() if path.is_file()}
          missing = sorted((expected | license_artifacts) - actual)
          unexpected = sorted(actual - expected - license_artifacts)
          empty = sorted(name for name in expected & actual if (output / name).stat().st_size == 0)
          if missing or unexpected or empty:
              raise SystemExit(
                  f"AdGuard output set invalid: missing={missing}, unexpected={unexpected}, empty={empty}"
              )
          readme = Path("README.md").read_text(encoding="utf-8")
          subscriptions = re.findall(
              r"\[[^\]]+\]\(https://raw\.githubusercontent\.com/[^/]+/[^/]+/dist/([^)]+)\)",
              readme,
          )
          if len(subscriptions) != len(expected) or set(subscriptions) != expected:
              raise SystemExit(
                  f"README subscription manifest mismatch: count={len(subscriptions)}, "
                  f"missing={sorted(expected - set(subscriptions))}, "
                  f"unexpected={sorted(set(subscriptions) - expected)}"
              )
          print("Validated the four AdGuard Full/Lite subscriptions.")
          PY

      - name: Validate audit report assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = (Path(".cache/audit"), Path(".cache/report"))
          for root in roots:
              if not root.exists():
                  raise SystemExit(f"Required report directory is missing: {root}")
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix == ".txt" and path.stat().st_size == 0:
                      path.write_text("! No entries matched this report.\n", encoding="utf-8")
                  elif path.suffix in {".md", ".json"} and path.stat().st_size == 0:
                      raise SystemExit(f"Required report is empty: {path}")
                  if path.suffix == ".json":
                      try:
                          json.loads(path.read_text(encoding="utf-8"))
                      except Exception as exc:
                          raise SystemExit(f"Invalid JSON report {path}: {exc}")
          lite_path = Path(".cache/audit/lite-scope-audit.json")
          lite = json.loads(lite_path.read_text(encoding="utf-8"))
          if not lite.get("available"):
              raise SystemExit("Lite domestic-scope audit did not run")
          if lite.get("validated_domain_input_count", 0) <= 0:
              raise SystemExit("Lite audit has no validated domain input")
          if lite.get("china_classified_domain_count", 0) <= 0:
              raise SystemExit("Lite audit has no validated China-classified domains")
          allow_conflicts = Path(".cache/audit/source-allow-conflicts-still-blocked.txt")
          if not allow_conflicts.is_file():
              raise SystemExit("Production source-allow conflict audit is missing")
          print("Audit report assets are present, non-empty, valid, and include a completed Lite-scope audit.")
          PY

      - name: Upload build quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-quality-evidence-${{ github.run_id }}
          path: |
            .cache/audit/**
            .cache/report/**
            .cache/out/adblockdns.txt
            .cache/out/adblockdnslite.txt
            .cache/out/adblockfilters.txt
            .cache/out/adblockfilterslite.txt
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Refuse to publish if main advanced during the build
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced during the build; refusing to publish stale output."
            exit 1
          fi

      - name: Upload sources to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: source
          name: Upstream Source Snapshots
          body: Build-time snapshots of the configured upstream rule sources, retained for provenance and audit. These files are not client subscriptions.
          make_latest: false
          files: .cache/source/*
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish source audit and baseline comparison reports
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: audit
          name: Quality and Source Audit
          body: Automated source, whitelist, Lite-scope, and upstream-baseline reports for maintenance and regression review. This release is audit evidence, not a subscription.
          make_latest: false
          files: |
            .cache/audit/source-audit.md
            .cache/audit/source-audit.json
            .cache/audit/source-policy-conflicts.json
            .cache/audit/source-allow-conflicts-still-blocked.txt
            .cache/audit/review-focus-unshared-candidates.txt
            .cache/audit/whitelist-coverage.json
            .cache/audit/whitelist-unused.txt
            .cache/audit/lite-scope-audit.json
            .cache/audit/lite-scope-known-non-china-covered.txt
            .cache/audit/lite-scope-china-domains-missing.txt
            .cache/audit/lite-scope-rules-not-classified-china.txt
            .cache/audit/lite-scope-unvalidated-source-domains.txt
            .cache/audit/lite-scope-invizible-known-non-china-covered.txt
            .cache/audit/lite-scope-invizible-china-domains-missing.txt
            .cache/audit/lite-scope-invizible-rules-not-classified-china.txt
            .cache/audit/invizible-allowlist-audit.json
            .cache/audit/invizible-allowlist-missing.txt
            .cache/audit/baseline-browser-analysis.json
            .cache/audit/baseline-only-browser-overlap.txt
            .cache/audit/baseline-only-allow-exceptions-still-blocked.txt
            .cache/audit/baseline-only-allow-exceptions-no-longer-needed.txt
            .cache/audit/baseline-only-no-browser-overlap.txt
            .cache/audit/baseline-only-current-dns-source-overlap.txt
            .cache/audit/baseline-only-current-source-allow-covered.txt
            .cache/audit/baseline-only-current-source-parent-inactive.txt
            .cache/audit/baseline-only-current-source-parent-inactive-blacklisted.txt
            .cache/audit/baseline-only-current-source-parent-inactive-whitelisted.txt
            .cache/audit/baseline-only-current-source-parent-inactive-allowed.txt
            .cache/audit/baseline-only-current-blacklist-overlap.txt
            .cache/audit/baseline-only-current-whitelist-covered.txt
            .cache/audit/baseline-only-current-source-unexplained.txt
            .cache/audit/baseline-only-not-effectively-covered-by-current-dns.txt
            .cache/audit/baseline-only-absent-from-current-dns-sources.txt
            .cache/report/comparison.md
            .cache/report/comparison.json
            .cache/report/optimized-only.txt
            .cache/report/baseline-only.txt
            .cache/report/lite-baseline-only.txt
            .cache/report/lite-optimized-only.txt
            .cache/report/lite-baseline-only-domains.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: ${{ steps.update.outputs.message }}

      - name: Publish to dist branch
        # 必须放在 Commit Changes 之后：孤儿分支切换会清空工作区（含刚生成的 README），
        # 若放前面，README 更新会丢失。dist 为孤儿分支，每轮 force-push 单提交，不产生历史。
        run: |
          set -euo pipefail
          build_main_sha="$(git rev-parse HEAD)"
          echo "BUILD_MAIN_SHA=$build_main_sha" >> "$GITHUB_ENV"
          mkdir -p /tmp/dist-out
          for name in adblockdns.txt adblockdnslite.txt adblockfilters.txt adblockfilterslite.txt; do
            cp ".cache/out/$name" "/tmp/dist-out/$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git fetch origin main
          if [ "$build_main_sha" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced before dist publication; refusing to publish stale output."
            exit 1
          fi
          git rm -rf . || true
          # git rm 只删已跟踪文件，.gitignore 也被删了，未跟踪的 .cache/ 会留下来并被 git add -A 收入；
          # clean 掉所有未跟踪文件（runner 用完即弃，此步已是任务最后一步），只留刚拷入的产物
          git clean -fdx
          cp /tmp/dist-out/* .
          git add -A
          expected_files="$(printf '%s\\n' adblockdns.txt adblockdnslite.txt adblockfilters.txt adblockfilterslite.txt | sort)"
          actual_files="$(git ls-files | sort)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "::error::dist must contain exactly the four AdGuard subscription files."
            printf 'Expected:\\n%s\\nActual:\\n%s\\n' "$expected_files" "$actual_files"
            exit 1
          fi
          git commit -m "Publish rules $(date -u +%Y%m%d%H%M)"
          git push -f origin dist

      - name: Verify main is still the build commit before final rule release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$BUILD_MAIN_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced after dist publication; refusing to publish stale rule release assets."
            exit 1
          fi



      - name: Upload rules to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: rule
          name: AdBlock DNS
          body: Automated Full and Lite advertising and tracking filters. Subscription formats and direct links are documented in README.
          make_latest: true
          files: .cache/out/*
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Verify published rule release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${REPOSITORY}/releases/tags/rule" --jq '.id')"
          actual="$(gh api --paginate "repos/${REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].name' | sort)"
          expected="$(printf '%s\\n' adblockdns.txt adblockdnslite.txt adblockfilters.txt adblockfilterslite.txt LICENSE-GPL-3.0.txt LICENSE-LGPL-3.0.txt LICENSE-MIT-anti-AD.txt LICENSE-MIT-StevenBlack.txt LICENSE-MPL-2.0-1Hosts.txt THIRD-PARTY-NOTICES.md source-licenses.json | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The rule release does not contain exactly the four subscriptions and approved license notices."
            printf 'Expected:\\n%s\\nActual:\\n%s\\n' "$expected" "$actual"
            exit 1
          fi
          echo "Verified the exact AdGuard rule release asset manifest."
