# Six independent non-filtering upstreams: three domestic and three global.
# Each listener maps to one provider; fastest-response pooling is disabled.
# All six must return NXDOMAIN for both A and AAAA before a name is considered dead.

bind 127.0.0.1:5053 -group domestic_dnspod -no-rule-addr -no-rule-nameserver -no-dualstack-selection -no-speed-check -no-cache
bind 127.0.0.1:5054 -group domestic_baidu -no-rule-addr -no-rule-nameserver -no-dualstack-selection -no-speed-check -no-cache
bind 127.0.0.1:5055 -group domestic_cnnic -no-rule-addr -no-rule-nameserver -no-dualstack-selection -no-speed-check -no-cache
bind 127.0.0.1:5056 -group global_google -no-rule-addr -no-rule-nameserver -no-dualstack-selection -no-speed-check -no-cache
bind 127.0.0.1:5057 -group global_quad9 -no-rule-addr -no-rule-nameserver -no-dualstack-selection -no-speed-check -no-cache
bind 127.0.0.1:5058 -group global_cloudflare -no-rule-addr -no-rule-nameserver -no-dualstack-selection -no-speed-check -no-cache

log-num 0
cache-size 0
dualstack-ip-selection no
# Each listener has one upstream only; no cross-provider fastest-answer selection.
response-mode fastest-response
force-qtype-SOA 65
tcp-idle-time 120

# Domestic non-filtering upstreams
server 119.29.29.29 -group domestic_dnspod -exclude-default-group -subnet 222.66.251.8/32
server 180.76.76.76 -group domestic_baidu -exclude-default-group -bootstrap-dns -subnet 222.66.251.8/32
server 1.2.4.8 -group domestic_alidns -exclude-default-group -bootstrap-dns -subnet 222.66.251.8/32

# Global non-filtering upstreams
server-tls 8.8.8.8 -host-name dns.google -tls-host-verify dns.google -group global_google -exclude-default-group
server-tls 9.9.9.10 -host-name dns10.quad9.net -tls-host-verify dns10.quad9.net -group global_quad9 -exclude-default-group
server-tls 1.1.1.1 -host-name one.one.one.one -tls-host-verify one.one.one.one -group global_cloudflare -exclude-default-group
