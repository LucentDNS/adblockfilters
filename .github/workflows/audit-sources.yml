name: Audit upstream sources

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/audit_sources.py'
      - '.github/workflows/audit-sources.yml'
      - 'README.md'
      - 'resolver.py'
      - 'readme.py'
      - 'blacklist.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install tld IPy loguru httpx dnspython pytest
      - name: Run regression tests
        run: python -m pytest -q
      - name: Audit source lists with current resolver
        run: python scripts/audit_sources.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-source-audit
          path: .cache/audit/
          if-no-files-found: warn
          retention-days: 14
