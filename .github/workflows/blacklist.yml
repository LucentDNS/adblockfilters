name: Generate DNS State

# README.md contains the upstream source manifest; source-table changes must trigger fresh DNS validation.
permissions:
  contents: write
  actions: write

concurrency:
  group: dns-validation-state
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - blacklist.py
      - smartdns.conf
      - resolver.py
      - updater.py
      - README.md
      - readme.py
      - scripts/generate_domain_input.py
      - scripts/validated_sources.py
      - scripts/verify_critical_domains.py
      - tests/test_critical_domains.py
      - tests/test_readme_generation.py
      - tests/test_smartdns_config.py
      - rules/myblock.txt
      - rules/direct.txt
      - rules/ipv4_china.txt
      - rules/white.txt
      - .github/workflows/blacklist.yml

env:
  TZ: Asia/Shanghai
  SMARTDNS_URL: https://github.com/pymumu/smartdns/releases/download/Release46.1/smartdns-x86_64
  SMARTDNS_PATH: /tmp/smartdns

jobs:
  Generate_Domain_State:
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          set -euo pipefail
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run DNS resolver regression tests
        run: |
          set -euo pipefail
          python -m py_compile blacklist.py
          python -m pytest -q tests

      - name: Setup SmartDNS
        run: |
          set -euo pipefail
          mkdir -p "$SMARTDNS_PATH"
          wget "$SMARTDNS_URL" -O "$SMARTDNS_PATH/smartdns"
          chmod +x "$SMARTDNS_PATH/smartdns"
          cp smartdns.conf "$SMARTDNS_PATH/smartdns.conf"
          nohup "$SMARTDNS_PATH/smartdns" -f -x -c "$SMARTDNS_PATH/smartdns.conf" > /dev/null 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if python3 - <<'PY'
          import socket
          packet = bytes.fromhex("00000100000100000000000003777777076578616d706c6503636f6d0000010001")
          for port in (5053, 5054):
              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                  sock.settimeout(2)
                  sock.sendto(packet, ("127.0.0.1", port))
                  sock.recvfrom(1024)
          PY
            then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" = "0" ]; then
            echo "SmartDNS not ready after 30s"
            exit 1
          fi

      - name: Verify domestic and global SmartDNS groups independently
        run: |
          set -euo pipefail
          python - <<'PY'
          import dns.resolver
          from dns.resolver import NXDOMAIN

          groups = {
              5053: ("baidu.com", "qq.com", "example.com"),
              5054: ("example.com", "cloudflare.com", "google.com"),
          }
          probe = "adblock-dns-probe-20261125.example.invalid"

          for port, domains in groups.items():
              resolver = dns.resolver.Resolver(configure=False)
              resolver.nameservers = ["127.0.0.1"]
              resolver.port = port
              resolver.timeout = 3.0
              resolver.lifetime = 8.0

              success = []
              for domain in domains:
                  try:
                      answer = resolver.resolve(domain, "A")
                      if len(answer) > 0:
                          success.append(domain)
                  except Exception as exc:
                      print(f"Group {port} probe failed for {domain}: {type(exc).__name__}: {exc}")

              if len(success) < 2:
                  raise SystemExit(f"SmartDNS group {port} health check failed: only {success} resolved")

              try:
                  resolver.resolve(probe, "A")
              except NXDOMAIN:
                  print(f"Group {port}: NXDOMAIN probe passed")
              else:
                  raise SystemExit(f"SmartDNS group {port} failed to return NXDOMAIN for reserved .invalid domain")

              print(f"Group {port} positive probes passed: {', '.join(success)}")
          PY

      - name: Download database
        run: |
          set -euo pipefail
          # The first AdBlock DNS run must not inherit upstream block/IP state.
          # Reuse a database only after our own fresh-validation marker exists.
          if curl -fsSL --retry 3 --retry-all-errors \
              "https://github.com/${{ github.repository }}/releases/download/dns-validation-state/dns-validation-bootstrap-complete-v2.txt" \
              -o /tmp/dns-validation-bootstrap-complete-v2.txt; then
            curl -fsSL --retry 3 --retry-all-errors -o domain.db \
              "https://github.com/${{ github.repository }}/releases/download/dns-validation-state/domain.db"
            test -s domain.db || { echo "DNS validation database is missing or empty"; exit 1; }
            echo "Using the previously generated DNS-validation database."
          else
            echo "No DNS validation marker found; starting with an empty database for a full independent DNS pass."
            : > domain.db
          fi

      - name: Generate DNS validation input from configured DNS sources
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_domain_input.py
          python scripts/generate_domain_input.py
          test -s .cache/domain/domain.txt || { echo "DNS domain input is missing or empty"; exit 1; }
          cp .cache/domain/domain.txt domain.txt
          cp .cache/domain/domain-input-provenance.json domain-input-provenance.json
          python -m py_compile scripts/validated_sources.py
          python scripts/validated_sources.py package
          cp .cache/domain/validated-dns-sources.tar.gz validated-dns-sources.tar.gz
          test -s validated-dns-sources.tar.gz || { echo "Validated DNS source archive was not packaged"; exit 1; }

      - name: Run DNS validation and generate independent blacklist
        id: generate
        run: |
          set -euo pipefail
          python -m py_compile blacklist.py
          python blacklist.py 2>&1 | tee blacklist.log
          test -s domain.db || { echo "domain.db missing after blacklist generation"; exit 1; }
          # Empty lists are represented by a comment-only file so GitHub can
          # publish a non-empty asset while the parser still treats it as empty.
          test -s black.txt || printf '! Validated blacklist: no confirmed dead domains\n' > black.txt
          test -s china.txt || printf '! Validated China list: no validated China domains\n' > china.txt
          printf 'Fresh DNS-validation database initialized on %s\n' "$(date -u +%F)" > dns-validation-bootstrap-complete-v2.txt
          echo "message=$(date)" >> "$GITHUB_OUTPUT"

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dns-validation-state-log
          path: blacklist.log
          if-no-files-found: warn

      - name: Write summary
        if: always()
        run: |
          {
            echo "### DNS Validation State"
            echo "- domain.txt: $(test -f domain.txt && wc -l < domain.txt || echo 0) lines"
            echo "- black.txt: $(test -f black.txt && wc -l < black.txt || echo 0) lines"
            echo "- china.txt: $(test -f china.txt && wc -l < china.txt || echo 0) lines"
            echo "- database: $(test -s domain.db && du -h domain.db | cut -f1 || echo missing)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish validated domain state
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: dns-validation-state
          name: Internal DNS validation state
          body: Internal DNS-validation state used by the production rule build. Not a user-facing rule subscription.
          prerelease: true
          make_latest: false
          files: |
            domain.db
            domain.txt
            domain-input-provenance.json
            validated-dns-sources.tar.gz
            black.txt
            china.txt
            dns-validation-bootstrap-complete-v2.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Remove obsolete DNS validation marker asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for obsolete in dns-validation-bootstrap-complete.txt; do
            if gh release view dns-validation-state --json assets --jq '.assets[].name' | grep -Fxq "$obsolete"; then
              gh release delete-asset dns-validation-state "$obsolete" --yes
            fi
          done

      - name: Verify dns-validation-state release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view dns-validation-state --json assets --jq '.assets[].name')"
          for name in domain.db domain.txt domain-input-provenance.json validated-dns-sources.tar.gz black.txt china.txt dns-validation-bootstrap-complete-v2.txt; do
            if ! grep -Fxq "$name" <<< "$assets"; then
              echo "::error::dns-validation-state release is missing $name"
              exit 1
            fi
          done

      - name: Remove obsolete development DNS releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for legacy in dev-domain-noble dev-domain; do
            if gh release view "$legacy" >/dev/null 2>&1; then
              gh release delete "$legacy" --cleanup-tag --yes
              echo "Removed obsolete release and tag: $legacy"
            fi
          done

          if git ls-remote --exit-code --heads origin lucentdns-dev >/dev/null 2>&1; then
            if git push origin --delete lucentdns-dev; then
              echo "Removed obsolete branch lucentdns-dev (191 commits behind main, no unique commits)."
            else
              echo "::warning::Could not delete obsolete branch lucentdns-dev; DNS validation and production build will continue."
            fi
          fi

      - name: Trigger production rule build after dns-validation-state publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update.yml --ref main
