# DNS validation uses two independent, non-filtering upstream groups.
# Domestic: DNSPod Public DNS, Baidu Public DNS and ByteDance Public DNS.
# Global: Google Public DNS, Quad9 No-Threat-Blocking and Cloudflare 1.1.1.1.
# Do not use security-filtering resolvers here: their policy NXDOMAIN can hide
# live malicious domains that this project is supposed to include in its blocklist.
# A domain is marked NXDOMAIN only when both regional groups independently agree.

#### Local listeners ####
bind 127.0.0.1:5053 -group domestic -no-rule-addr -no-rule-nameserver -no-dualstack-selection -force-aaaa-soa -no-speed-check -no-cache
bind 127.0.0.1:5054 -group global -no-rule-addr -no-rule-nameserver -no-dualstack-selection -force-aaaa-soa -no-speed-check -no-cache

#### Logging ####
log-num 0

#### Cache ####
cache-size 0

#### IPv6 ####
dualstack-ip-selection no
force-AAAA-SOA yes

#### Response mode ####
# Keep the upstream fast-response behavior; blacklist.py independently cross-checks
# the domestic and global groups before treating a name as NXDOMAIN.
response-mode fastest-response

#### Other ####
force-qtype-SOA 65
tcp-idle-time 120

#### Domestic upstream DNS providers (non-filtering) ####
# DNSPod Public DNS (DoH)
server-https https://doh.pub/dns-query -group domestic -exclude-default-group
# Baidu Public DNS (ECS for a Shanghai Telecom resolution view)
server 180.76.76.76 -group domestic -exclude-default-group -subnet 222.66.251.8/32
# ByteDance Public DNS (ECS for a Shanghai Telecom resolution view)
server 180.184.1.1 -group domestic -exclude-default-group -subnet 222.66.251.8/32

#### Global upstream DNS providers (non-filtering) ####
# Google Public DNS
server-tls 8.8.8.8 -host-name dns.google -tls-host-verify dns.google -group global -exclude-default-group
# Quad9 No-Threat-Blocking
server-tls 9.9.9.10 -host-name dns10.quad9.net -tls-host-verify dns10.quad9.net -group global -exclude-default-group
# Cloudflare standard resolver (no content filtering)
server-tls 1.1.1.1 -host-name one.one.one.one -tls-host-verify one.one.one.one -group global -exclude-default-group
