# DNS validation uses two independent upstream groups:
#   domestic: AliDNS, DNSPod and 360 (Shanghai Telecom ECS)
#   global:   Google Public DNS, Quad9 and Cloudflare
# A domain is marked NXDOMAIN only when both groups independently agree.

#### Local listeners ####
bind 127.0.0.1:5053 -group domestic -no-rule-addr -no-rule-nameserver -no-dualstack-selection -force-aaaa-soa -no-speed-check -no-cache
bind 127.0.0.1:5054 -group global -no-rule-addr -no-rule-nameserver -no-dualstack-selection -force-aaaa-soa -no-speed-check -no-cache

#### Logging ####
log-num 0

#### Cache ####
cache-size 0

#### IPv6 ####
dualstack-ip-selection no
force-AAAA-SOA yes

#### Response mode ####
# Fast response is retained from the upstream design; the two independent
# regional groups are cross-checked by blacklist.py before NXDOMAIN is accepted.
response-mode fastest-response

#### Other ####
force-qtype-SOA 65
tcp-idle-time 120

#### Domestic upstream DNS providers ####
# AliDNS
server-tls 223.5.5.5 -group domestic -exclude-default-group -subnet 222.66.251.8/32
# DNSPod
server-tls 1.12.12.12 -group domestic -exclude-default-group -subnet 222.66.251.8/32
# 360 DNS
server-tls 101.226.4.6 -group domestic -exclude-default-group -subnet 222.66.251.8/32

#### Global upstream DNS providers ####
# Google Public DNS
server-tls 8.8.8.8 -group global -exclude-default-group
# Quad9
server-tls 9.9.9.11 -group global -exclude-default-group
# Cloudflare
server-tls 1.1.1.1 -host-name cloudflare-dns.com -group global -exclude-default-group
